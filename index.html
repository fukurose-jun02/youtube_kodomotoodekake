  /* ── InView fade-up ───────────────────────── */

    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.8s cubic-bezier(.25,.8,.25,1),

  /* ── Button hover ─────────────────────────── */

    transform: translateY(-2px) !important;

    box-shadow: 0 6px 18px rgba(60,40,10,0.2) !important;
  }

  /* ── Link underline left→right ───────────── */
  .link-underline {
    position: relative;
    display: inline-block;
  }
  .link-underline::after {
    content: '';
    position: absolute;
    left: 0; bottom: -2px;
    width: 0; height: 1.5px;
    background: currentColor;
    transition: width 0.35s cubic-bezier(.25,.8,.25,1);
  }
  .link-underline:hover::after { width: 100%; }

    transition: transform 0.18s ease, filter 0.18s ease !important;

  @keyframes charBob {
    0%,100% { transform: translateY(0) rotate(var(--char-rot, 0deg)); }

  @keyframes charBobAlt {
    0%,100% { transform: translateY(0) rotate(var(--char-rot, 0deg)); }

    animation: charBob 5.5s ease-in-out infinite;

    filter: brightness(1.05) drop-shadow(0 6px 14px rgba(40,20,4,0.35));

    position: absolute;
    background: #fffaf0;
    color: #3d2e1e;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(40,20,4,0.18);
    white-space: nowrap;
    border: 1.5px solid #e8ddc8;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    width: 12px; height: 12px;
    background: #fffaf0;
    border-right: 1.5px solid #e8ddc8;
    border-bottom: 1.5px solid #e8ddc8;

  @keyframes bearWobble {

    40%     { transform: rotate(4deg); }

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─────────────────────────────────────────────
// useInView hook — IntersectionObserver でフェードイン
// ─────────────────────────────────────────────
function useInView(options = {}) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px', ...options });
    observer.observe(el);
    return () => observer.disconnect();
  }, []);
  return ref;
}

// グリッド全体の子要素を一括でInViewに登録するhook
function useInViewGrid(deps = []) {
  const ref = useRef(null);
  useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const items = container.querySelectorAll('.inview');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    items.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, deps);
  return ref;
}

// ─────────────────────────────────────────────
// AI MODAL (Gemini suggestion)
// ─────────────────────────────────────────────
function AiModal({ onClose }) {
  const [theme, setTheme] = useState('');
  const [loading, setLoading] = useState(false);
  const [ideas, setIdeas] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    const fn = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', fn);
    return () => document.removeEventListener('keydown', fn);
  }, [onClose]);

  const handleGenerate = async () => {
    if (!theme.trim()) { setError('テーマを入力してください'); return; }
    setError(''); setLoading(true); setIdeas(null);
    try {
      const prompt = `「${theme}」をテーマにした、日本の関西地方の4歳の双子の子どもとのお出かけ先アイデアを3つ、具体的な場所を含めてJSON形式で提案してください。各アイデアには title（場所の名前）と description（おすすめポイント）を含めてください。`;
      const res = await window.claude.complete({
        messages: [{ role:'user', content: prompt + '\n\nJSON配列形式のみで返答してください。例: [{"title":"場所名","description":"説明"}]' }]
      });
      const match = res.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        setIdeas(parsed);
      } else {
        setError('提案の取得に失敗しました。もう一度お試しください。');
      }
    } catch(e) {
      setError('エラーが発生しました。もう一度お試しください。');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(20,12,4,0.72)',
      zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:'16px'
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'#fffaf3', borderRadius:'22px', padding:'28px',
        maxWidth:'480px', width:'100%',
        boxShadow:'0 24px 72px rgba(40,20,4,0.4)'
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px'}}>
          <h2 style={{fontSize:'20px', fontWeight:'700', color:'#3d2e1e', display:'flex', alignItems:'center', gap:'8px'}}>
            <span style={{fontSize:'24px'}}>✨</span>AIおでかけプランナー
          </h2>
          <button onClick={onClose} style={{
            background:'none', border:'none', fontSize:'22px', cursor:'pointer', color:'#a09080', lineHeight:1
          }}>✕</button>
        </div>
        <p style={{fontSize:'13px', color:'#6a5a4a', marginBottom:'18px', lineHeight:1.7}}>
          どんなおでかけにしたいですか？<br/>
          <span style={{fontSize:'12px', opacity:0.7}}>例：雨の日でも楽しめる、体を動かしたい、自然を感じたい</span>
        </p>
        <div style={{display:'flex', flexDirection:'column', gap:'12px'}}>
          <input
            type="text"
            value={theme}
            onChange={e=>setTheme(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter') handleGenerate();}}
            placeholder="テーマを入力…"
            style={{
              border:'2px solid #d4c8b8', borderRadius:'12px', padding:'12px 16px',
              fontFamily:"'Zen Maru Gothic',sans-serif", fontSize:'15px', color:'#3d2e1e',
              outline:'none', background:'#fffdf8',
              transition:'border-color 0.2s'
            }}
            onFocus={e=>e.target.style.borderColor='#5a7a3a'}
            onBlur={e=>e.target.style.borderColor='#d4c8b8'}
          />
          <button
            onClick={handleGenerate}
            disabled={loading}
            style={{
              background: loading ? '#a0b880' : '#5a7a3a',
              color:'white', border:'none', borderRadius:'12px',
              padding:'13px 20px', fontFamily:"'Zen Maru Gothic',sans-serif",
              fontSize:'15px', fontWeight:'700', cursor: loading ? 'default' : 'pointer',
              display:'flex', alignItems:'center', justifyContent:'center', gap:'8px',
              transition:'background 0.2s'
            }}
          >
            {loading ? (
              <>
                <span style={{
                  display:'inline-block', width:'16px', height:'16px',
                  border:'2px solid rgba(255,255,255,0.4)',
                  borderTopColor:'white', borderRadius:'50%',
                  animation:'spin 0.8s linear infinite'
                }}/>
                考え中…
              </>
            ) : '提案してもらう'}
          </button>
        </div>
        {error && (
          <p style={{marginTop:'12px', fontSize:'13px', color:'#c04040'}}>{error}</p>
        )}
        {ideas && ideas.length > 0 && (
          <div style={{marginTop:'20px'}}>
            <p style={{fontSize:'13px', fontWeight:'700', color:'#5a7a3a', marginBottom:'10px'}}>
              AIからの提案はこちら 🌿
            </p>
            <div style={{display:'flex', flexDirection:'column', gap:'10px'}}>
              {ideas.map((idea,i)=>(
                <div key={i} style={{
                  background:'#f0f8e8', border:'1px solid #c8ddb0',
                  borderRadius:'12px', padding:'14px 16px'
                }}>
                  <div style={{fontWeight:'700', color:'#3a5a20', fontSize:'14px', marginBottom:'5px'}}>
                    {idea.title}
                  </div>
                  <div style={{fontSize:'12px', color:'#5a7a4a', lineHeight:1.7}}>
                    {idea.description}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

const CHAR_SRC = {
  kinoko:   'uploads/kinokoojisan.png',
  happa:    'uploads/happachan.png',
  kitsune:  'uploads/kitsune.png',
  tanuki:   'uploads/tanuki.png',
  donguri:  'uploads/donguriboya.png',
  ouchi:    'uploads/dongurinoouchi.png',
  wreath:   'uploads/kinomirisu.png',
  table:    'uploads/kinokotable.png',
  kasa:     'uploads/happanokasa.png',
  kago:     'uploads/dongurinokago.png',
};
function Character({ kind, size=110, top, left, right, bottom, rotate=0, alt=false, flip=false, bubble=null, bubblePos='center', z=1 }) {
  return (
    <div style={{
      position:'absolute', top, left, right, bottom, zIndex:z,
      pointerEvents:'none', width:size
    }}>
      {bubble && (
        <div className={`bubble ${bubblePos}`} style={{
          left: bubblePos==='left' ? '-6px' : bubblePos==='right' ? 'auto' : '50%',
          right: bubblePos==='right' ? '-6px' : 'auto',
          transform: bubblePos==='center' ? 'translateX(-50%)' : 'none',
          bottom: `${size + 14}px`
        }}>{bubble}</div>
      )}
      <img src={CHAR_SRC[kind]} alt=""
        className={alt ? 'char-float-alt' : 'char-float'}
        style={{
          width:'100%', height:'auto', display:'block',
          ['--char-rot']: `${rotate}deg`,
          transform: `${flip?'scaleX(-1) ':''}rotate(${rotate}deg)`,
          filter:'drop-shadow(0 4px 10px rgba(40,20,4,0.25))'
        }}/>
    </div>
  );
}

// ─────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [activeCat, setActiveCat] = useState('すべて');
  const [activeYear, setActiveYear] = useState('すべて');

  const [modalVideo, setModalVideo] = useState(null);
  const [showAi, setShowAi] = useState(false);

  const filtered = useMemo(() => VIDEOS.filter(v => {
    const matchCat  = activeCat  === 'すべて' || v.cat  === activeCat;
    const matchYear = activeYear === 'すべて' || String(v.year) === activeYear;
    const q = search.trim().toLowerCase();
    const matchQ = !q || v.title.toLowerCase().includes(q) || (v.desc||'').toLowerCase().includes(q) || v.cat.includes(q);
    return matchCat && matchYear && matchQ;

  `;

          <Character kind="wreath" size={70} top={'82%'} right={-30} rotate={-4} z={5}/>
          <Character kind="ouchi" size={110} bottom={'68%'} right={-46} rotate={2} alt z={5}/>

          <div ref={useInViewGrid([filtered])} style={{
            display:'grid',
            gridTemplateColumns:'repeat(auto-fill, minmax(min(100%, 230px), 1fr))',
            gap:'28px', position:'relative', zIndex:2

            {filtered.map((v,i)=>(
              <CardC key={v.id} video={v} onPlay={setModalVideo} primary={primary} idx={i} delayIdx={i}/>
            ))}
          </div>
          {filtered.length===0 && (
            <div style={{textAlign:'center', padding:'60px 20px', color:'#a09080', fontSize:'16px'}}>
              <div style={{fontSize:'48px', marginBottom:'16px'}}>🌿</div>
              動画が見つかりませんでした
            </div>
          )}

        <Footer siteName={tweaks.siteName}/>

      {/* MODALS */}
      {modalVideo && <VideoModal video={modalVideo} onClose={()=>setModalVideo(null)}/>}
      {showAi && <AiModal onClose={()=>setShowAi(false)}/>}

      {/* TWEAKS PANEL */}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="バリエーション">
          <window.TweakRadio label="デザイン" value={tweaks.variant} options={[
            {label:'A カード', value:'A'},

            {label:'C ポラロイド', value:'C'}
          ]} onChange={v=>setTweak('variant',v)}/>
        </window.TweakSection>
        <window.TweakSection label="テキスト">
          <window.TweakText label="サイト名" value={tweaks.siteName} onChange={v=>setTweak('siteName',v)}/>

        </window.TweakSection>
        <window.TweakSection label="カラー">
          <window.TweakColor label="メインカラー" value={tweaks.primaryColor} onChange={v=>setTweak('primaryColor',v)}/>
          <window.TweakColor label="アクセント" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
          <window.TweakColor label="背景色(A)" value={tweaks.bgColor} onChange={v=>setTweak('bgColor',v)}/>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
